<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CMS - Forgot Password OTP </title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #eef2f7;
        }

        .container {
            max-width: 430px;
            margin: 60px auto;
            background: #ffffff;
            padding: 40px 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
            border: 1px solid #e0e0e0;
        }

        .logo {
            text-align: center;
        }

        .info {
            margin: 15px 0 20px;
            line-height: 1.6;
            color: #333;
        }

        h3 {
            margin: 0;
            color: #222;
        }

        .otp-box {
            margin: 25px 0;
            text-align: center;
        }

        .otp-code {
            display: inline-block;
            letter-spacing: 8px;
            font-size: 28px;
            font-weight: bold;
            color: #3222ab;
            background: #f3f0ff;
            padding: 12px 20px;
            border-radius: 10px;
            border: 1px dashed #6a5cff;
        }

        .footer {
            margin-top: 30px;
            font-size: 12px;
            color: #999;
            text-align: center;
            border-top: 1px solid #e0e0e0;
            padding-top: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
        <!-- Logo -->
        <div class="logo">
            <h1>College Management System</h1>
        </div>

        <!-- User Info -->
        <div class="info">
            <h3>Hello {{name}} !</h3>
        </div>

        <div class="info">
            <p style="margin-bottom: 20px;">
                Welcome to <strong>CMS</strong>.
            </p>
        </div>

        <div class="info">
            <p>
                We received a request to access your account. Use the OTP below to complete the process.
            </p>
        </div>

        <div class="info otp-box">
            <div class="otp-code">
                {{otp}}
            </div>
        </div>

        <div class="info">
            <p>
                This OTP is valid for 10 minutes.
            </p>
        </div>

        <div class="footer">
            &copy; 2026 CMS. All rights reserved.
        </div>
    </div>
</body>

</html>
