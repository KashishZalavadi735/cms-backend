<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Verification Code</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font Awesome -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #f4f6f8;
    }

    .container {
      max-width: 420px;
      margin: 60px auto;
      background: #ffffff;
      padding: 40px 30px;
      text-align: center;
      border-radius: 10px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      border: 1px solid #000;
    }

    .logo {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 25px;
    }

    .logo-icon {
      width: 36px;
      height: 36px;
      background-color: #3222ab;
      border-radius: 6px;
      margin-right: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon i {
      color: #ffffff;
      font-size: 18px;
    }

    .logo-text {
      font-size: 28px;
      font-weight: bold;
      color: #000;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 15px;
      color: #333;
    }

    .user-info {
      margin: 15px 0 25px;
      font-size: 17px;
      color: #444;
      line-height: 1.6;
    }

    .credentials-box {
      margin: 20px 0;
      padding: 15px;
      border: 1px dashed #ccc;
      border-radius: 8px;
      background-color: #fafafa;
    }

    .credentials-title {
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #333;
      text-transform: uppercase;
    }

    .credential {
      font-size: 15px;
      color: #000;
      margin-bottom: 6px;
      text-align: left;
    }

    .otp {
      font-size: 30px;
      font-weight: bold;
      letter-spacing: 6px;
      margin: 15px 0;
      color: #000;
    }

    .note {
      font-size: 13px;
      color: #888;
      margin-top: 10px;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #aaa;
    }
  </style>
</head>

<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <div class="logo-icon">
        <i class="fa-solid fa-landmark" style="color: #ffffff;"></i>
      </div>
      <div class="logo-text">CMS</div>
    </div>

    <!-- User Info -->
    <div class="user-info">
      <div><b>Hello </b> {{name}} !</div>
    </div>

    <div class="description">
      Welcome to <b>College Management System</b>. Your account has been created successfully.
    </div>

    <!-- Verification -->
    <h2 style="text-align: left;">Login Credentials</h2>

    <div class="credentials-box">
      <div class="credential">
        <b>Username:</b> {{email}}
      </div>

      <div class="credential">
        <b>One-Time Password (OTP):</b>
      </div>

      <div class="otp">{{otp}}</div>
    </div>

    <div class="note">
      This OTP is valid for 6 minutes. Do not share it with anyone.
    </div>

    <div class="footer">
      &copy; 2026 CMS. All rights reserved.
    </div>
  </div>
</body>
</html>
