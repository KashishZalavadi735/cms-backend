<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>CMS - Credentials mail for Admin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
      background-color: #eef2f7;
    }

    .container {
      max-width: 430px;
      margin: 60px auto;
      background: #ffffff;
      padding: 40px 30px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.12);
      border: 1px solid #e0e0e0;
    }

    .logo{
      text-align: center;
    }
    .info {
      margin: 15px 0 20px;
      line-height: 1.6;
      color: #333;
    }

    h3 {
      margin: 0;
      color: #222;
    }


    .details p {
      margin: 6px 0;
    }

    .footer {
      margin-top: 30px;
      font-size: 12px;
      color: #999;
      text-align: center;
      border-top: 1px solid #e0e0e0;
      padding-top: 15px;
    }
  </style>

</head>

<body>
  <div class="container">
    <!-- Logo -->
    <div class="logo">
      <h1>College Management System</h1>
    </div>

    <!-- User Info -->
    <div class="info">
      <h3>Hello {{name}} !</h3>
    </div>

    <div class="info">
      <p style="margin-bottom: 20px;">
        Welcome to <strong>CMS</strong>.
      </p>
    </div>

    <div class="info">
      <p>
        Your Admin (HOD) account has been created successfully.
      </p>
    </div>

    <div class="details">
      <p><strong>Email:</strong> {{email}}</p>
      <p><strong>Role:</strong> Admin (HOD)</p>
      <p><strong>Branch:</strong> {{branch}}</p>
    </div>

    <div class="info">
      <p>Click below to set your password:</p>
      <p><a href="{{setPasswordLink}}">{{setPasswordLink}}</a></p>
    </div>

    <div class="info">
      <p>
        This link expires in 24 hours.
      </p>
    </div>


    <div class="footer">
      &copy; 2026 CMS. All rights reserved.
    </div>
  </div>
</body>

</html>
